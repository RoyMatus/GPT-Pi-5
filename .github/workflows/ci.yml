name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install . playwright==1.65.0
      - run: python -m playwright install --with-deps chromium
      # FakeCloud/FakeVoice and intercepted OAuth use synthetic accounts/audio only.
      # No cloud credentials, voice models, real microphone or device access.
      - name: Synthetic voice and audio controls
        timeout-minutes: 5
        run: python tests/browser_voice.py
      - name: Synthetic remembered sign-in and logout
        timeout-minutes: 5
        run: python tests/browser_remember_login.py

      - name: Synthetic dashboard shell layout
        timeout-minutes: 5
        run: python tests/browser_dashboard_foundation.py

      - name: Synthetic calendar CRUD
        timeout-minutes: 5
        run: python tests/browser_dashboard_calendar.py

      - name: Synthetic market watchlist
        timeout-minutes: 5
        run: python tests/browser_dashboard_markets.py
